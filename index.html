    case "kalToday": calDate=today(); calWeek=mondayOf(today()); calMon=today().slice(0,7); render(); break;
    case "calDay": if(view==="plan"&&b.classList.contains("cdnum")){calDate=b.dataset.v; calView="day"; render()} else sheetDay(b.dataset.v); break;
    case "unplan": {const t=S.tasks.find(x=>x.id===id); if(t){t.plan=""; commit(); if(b.dataset.day) sheetDay(b.dataset.day)} break}
    case "sunMenu": {const m=document.getElementById("sceneMenu"); m.hidden=!m.hidden; if(!m.hidden) m.innerHTML=sceneMenuHTML(); b.setAttribute("aria-expanded",String(!m.hidden)); break}
    case "wsize": {const h=S.settings.home; h.size=h.size||{}; const cur=spanOf(b.dataset.w); h.size[b.dataset.w]=SPANS[(SPANS.indexOf(cur)+1)%SPANS.length]; commit(); break}
    case "wreset": S.settings.home.size={}; S.settings.home.order=["ring","courses","tasks","tue","reading","loans"]; commit(); break;
    case "wmove": moveWidget(b.dataset.w,+b.dataset.d); break;
    case "whide": S.settings.home.hidden.push(b.dataset.w); commit(); break;
    case "wshow": S.settings.home.hidden=S.settings.home.hidden.filter(x=>x!==b.dataset.w); commit(); break;
    case "scene": {S.settings.scene=b.dataset.v; applyLook(); commit(); const m=document.getElementById("sceneMenu"); if(m&&!m.hidden) m.innerHTML=sceneMenuHTML(); break}
    case "frost": S.settings.frost=b.dataset.v; applyLook(); commit(); break;
    case "tue": setTue(b.dataset.d,b.dataset.s); break;
    case "tueDot": sheetTue(b.dataset.d); break;
    case "tueSet": setTue(b.dataset.d,b.dataset.s); sheetTue(b.dataset.d); break;
    case "room": libRoom=b.dataset.v; libZoom=null; libScroll=0; render(); break;
    case "zoom": libZoom=id; render(); window.scrollTo(0,0); break;
    case "unzoom": libZoom=null; render(); break;
    case "settingsMod": setTab="calendar"; calMode="mod"; {const n=cycle().next; calMonth=(n||today()).slice(0,8)+"01"} sheetSettings(); break;
    case "settingsTue": setTab="calendar"; calMode="tue"; calMonth=today().slice(0,8)+"01"; sheetSettings(); break;
    case "calMode": calMode=b.dataset.v; sheetSettings(true); break;
    case "calNav": {const d=parse(calMonth); d.setMonth(d.getMonth()+(+b.dataset.v)); calMonth=d2s(d).slice(0,8)+"01"; sheetSettings(true); break}
    case "calDay": calToggle(b.dataset.d); break;
    case "tueRemove": {const d=b.dataset.d; snap(); S.tueDates=S.tueDates.filter(x=>x!==d); if(S.tue[d]&&S.tue[d].s==="done") S.xp=Math.max(0,S.xp-XP.tue); delete S.tue[d]; closeSheet(); commit(); undoToast("Дату прибрано"); break}
    case "addRoom": sheetRoom(); break;
    case "editRoom": sheetRoom(S.rooms.find(r=>r.id===id)); break;
    case "delRoom": {const r=S.rooms.find(x=>x.id===id); snap(); S.rooms=S.rooms.filter(x=>x.id!==id); S.courses.forEach(c=>{if(c.room===id)c.room="main"}); libRoom="main"; commit(); undoToast(`Кімнату «${r.name}» видалено, полиці в Головній залі`); break}
    case "addBook": sheetBookEdit(null,b.dataset.course); break;
    case "book": sheetBook(S.books.find(x=>x.id===id)); break;
    case "editBook": sheetBookEdit(S.books.find(x=>x.id===id)); break;
    case "bstatus": {const bk=S.books.find(x=>x.id===id); bk.status=b.dataset.v; if(bk.status==="done") bk.page=bk.total; bookFinishCheck(bk); commit(); sheetBook(bk); break}
    case "delBook": snap(); S.books=S.books.filter(x=>x.id!==id); closeSheet(); commit(); undoToast("Книгу прибрано"); break;
    case "delModule": S.settings.modules=S.settings.modules.filter(x=>x!==b.dataset.d); commit(); sheetSettings(); break;
    case "clearEx": snap(); S.courses=S.courses.filter(c=>!c.example); S.tasks=S.tasks.filter(t=>!t.example&&course(t.courseId)); S.books=S.books.filter(x=>!x.example); S.books.forEach(x=>{if(x.courseId&&!course(x.courseId))x.courseId=""}); commit(); undoToast("Приклади прибрано"); break;
    case "closeSheet": closeSheet(); break;
    case "focus": if(+b.dataset.t>0) startFocus(+b.dataset.t); else openFMenu(b); break;
    case "planToday": {const t=S.tasks.find(x=>x.id===id); if(t){t.plan=today(); commit(); toast(`«${t.title}» — на сьогодні`)} break}
    case "planAllMissed": {const td=today(); let n=0; S.tasks.forEach(x=>{if(x.kind==="task"&&!x.done&&x.plan&&x.plan<td){x.plan=td;n++}}); commit(); toast(`${n} ${pl(n,"завдання","завдання","завдань")} перенесено на сьогодні`); break}
    case "tdToggle": {const k=b.dataset.k; tdCollapsed.has(k)?tdCollapsed.delete(k):tdCollapsed.add(k); try{localStorage.setItem("studyquest.tdcol",JSON.stringify([...tdCollapsed]))}catch(e){} render(); break}
    case "todayGroup": S.settings.todayGroup=b.dataset.v; commit(); break;
    case "setTab": setTab=b.dataset.v; sheetSettings(); break;
    case "fgo": fmGo(+b.dataset.v); break;
    case "fpause": fPause(); break;
    case "fstop": stopFocus(true); break;
    case "fcancel": stopFocus(false); break;
    case "resetAsk": document.getElementById("resetZone").innerHTML=`<div class="banner" style="background:var(--warn-soft)"><span>Це видалить усі курси, завдання, книги, нотатки і XP.</span><button type="button" class="btn danger sm" data-act="resetGo">Видалити все</button></div>`; break;
    case "resetGo": snap(); S=fresh(); S.seeded=true; closeSheet(); applyLook(); commit(); undoToast("Усе скинуто"); break;
  }
});
document.addEventListener("scroll",e=>{if(e.target&&e.target.id==="libscene")libScroll=e.target.scrollLeft},true);
document.addEventListener("input",e=>{if(e.target.closest&&e.target.closest("#gsForm")){gsAlloc();return}if(e.target.id==="gq"){gsearch(e.target.value);return}if(e.target.id==="lib-q"){libQ=e.target.value;runSearch()}});
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.tsort){S.settings.taskSort=e.target.value; commit(); return}
  const cbm=e.target.dataset&&e.target.dataset.cbmove;
  if(cbm){const bk=S.books.find(x=>x.id===e.target.value), c=course(cbm); if(!bk||!c) return; snap(); bk.courseId=cbm; delete bk.pos; commit(); undoToast(`«${bk.title}» тепер на полиці курсу`); return}
  const gtc=e.target.dataset&&e.target.dataset.gtotal;
  if(gtc){const c=course(gtc); if(!c) return; c.grading=c.grading||{type:"",parts:[]}; c.grading.total=clamp(parseInt(e.target.value,10)||100,1,1000); commit(); toast(`Максимум за курс: ${c.grading.total}`); return}
  const gd=e.target.dataset&&e.target.dataset.g;
  if(gd){const c=course(gd), x=c&&c.grading&&c.grading.parts.find(y=>y.id===e.target.dataset.p); if(!x) return;
    const f=e.target.dataset.f, val=e.target.value.trim();
    if(f==="name"){if(val) x.name=val}
    else if(f==="max"){x.max=clamp(parseFloat(val)||0,0,gradeOf(c).total); if(x.got!=null&&x.got>x.max) x.got=x.max}
    else {const prevGot=x.got; x.got=val===""?null:clamp(parseFloat(val)||0,0,x.max); if(x.got!=null&&x.got!==prevGot) pendingToasts.push({msg:`${x.name}: ${x.got} з ${x.max}`})}
    commit({norender:true});
    setTimeout(()=>{const id=document.activeElement&&document.activeElement.id; render(); if(id){const el=document.getElementById(id); if(el) el.focus()}},0);
    return}if(e.target.id==="f-course"&&focusMem){focusMem.courseId=e.target.value;setFocus(focusMem)}});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return; if(dp){const bt=dp.btn; closeDP(); bt.focus(); return} const m=document.getElementById("sceneMenu"); if(m&&!m.hidden){m.hidden=true;document.getElementById("sunBtn").focus();return} if(document.getElementById("sheetRoot").innerHTML)closeSheet()});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]"); if(!f) return; e.preventDefault();
  const v=id=>((document.getElementById(id)||{}).value||"");
  switch(f.dataset.form){
    case "quick": case "quickc":{
      const inp=f.querySelector("input"), title=inp.value.trim(); if(!title) return;
      const cid=f.dataset.form==="quick"?v("qa-course"):f.dataset.course;
      const qd=f.querySelector('input[type="date"]'); const due=qd?qd.value:"";
      S.tasks.push({id:uid(),courseId:cid,title,due,kind:"task",recall:false,done:false,createdAt:Date.now()});
      commit(); const ni=document.getElementById(f.dataset.form==="quick"?"qa-title":"qc-title"); if(ni) ni.focus();
      if(f.dataset.form==="quick"){const sel=document.getElementById("qa-course");if(sel)sel.value=cid}
      break}
    case "sub":{
      const t=S.tasks.find(x=>x.id===f.dataset.id), inp=f.querySelector("input"), txt=inp.value.trim(); if(!t||!txt) return;
      t.subs=[...subsOf(t),{id:uid(),t:txt,done:false}]; if(t.done) reopen(t);
      commit(); const el=document.getElementById("sub-"+t.id); if(el) el.focus(); break}
    case "event":{const d=evFormDraft(); if(!d.title.trim()) return; d.title=d.title.trim(); S.events=S.events||[];
      if(d.id){const ev=S.events.find(x=>x.id===d.id); if(ev) Object.assign(ev,d)} else {d.id=uid(); d.createdAt=Date.now(); S.events.push(d)}
      closeSheet(); commit(); toast(`Подія: ${d.title} · ${fmtS(d.date)}${d.time?" "+d.time:""}`); break}
    case "planday":{const t=S.tasks.find(x=>x.id===v("pd-task")), d=f.dataset.day; if(!t) return; t.plan=d; commit(); sheetDay(d); break}
    case "fcustom":{const m=clamp(parseInt(v("fm-min"),10)||0,0,600); if(m>0) fmGo(m); break}
    case "gscore":{
      const c=course(f.dataset.course); if(!c||!c.grading) return; snap();
      f.querySelectorAll("input[data-p]").forEach(inp=>{const x=c.grading.parts.find(y=>y.id===inp.dataset.p); if(!x) return; const val=inp.value.trim(); x.got=val===""?null:clamp(parseFloat(val)||0,0,x.max)});
      closeSheet(); commit(); const G=gradeOf(c); toast(`Бали збережено: ${fmtN(G.got)} з ${G.total}`); break}
    case "gsetup":{
      const c=course(f.dataset.course); if(!c) return; snap();
      c.grading=c.grading||{type:"",parts:[]}; const total=clamp(parseInt(v("gs-total"),10)||100,1,1000), old=c.grading.parts||[];
      c.grading.total=total;
      c.grading.parts=[...f.querySelectorAll(".gsrow")].map(r=>{const name=r.querySelector('[data-k="n"]').value.trim(), mx=clamp(parseFloat(r.querySelector('[data-k="m"]').value)||0,0,total); if(!name||!mx) return null;
        const prev=old.find(y=>y.id===r.dataset.p); return {id:prev?prev.id:uid(),name,max:mx,got:prev&&prev.got!=null?Math.min(prev.got,mx):null}}).filter(Boolean);
      closeSheet(); commit(); toast("Складові збережено"); break}
    case "gadd":{
      const c=course(f.dataset.course), name=v("ga-name").trim(), mx=c?clamp(parseFloat(v("ga-max"))||0,0,gradeOf(c).total):0; if(!c||!name||!mx) return;
      c.grading=c.grading||{type:"",parts:[]}; c.grading.parts.push({id:uid(),name,max:mx,got:null});
      commit(); const el=document.getElementById("ga-name"); if(el) el.focus(); break}
    case "task":{
      const id=v("t-id"), title=v("t-title").trim(); if(!title) return;
      const data={title,courseId:v("t-course"),due:v("t-due"),plan:v("t-plan"),recall:document.getElementById("t-recall").checked,diff:+v("t-diff")||0,ttype:v("t-type")||"task"};
      const lines=v("t-subs").split("\n").map(x=>x.trim()).filter(Boolean).slice(0,40);
      if(id){const t=S.tasks.find(x=>x.id===id); if(t){const prev=subsOf(t); Object.assign(t,data); t.example=false;
          t.subs=lines.map(l=>{const pv=prev.find(x=>x.t===l);return pv?{...pv}:{id:uid(),t:l,done:false}});
          if(t.subs.length&&t.subs.every(x=>x.done)&&!t.done){closeSheet();completeTask(t.id);break}
          if(t.done&&t.subs.some(x=>!x.done)) reopen(t)}}
      else {const nid=uid(); S.tasks.push(Object.assign({id:nid,kind:"task",done:false,createdAt:Date.now(),subs:lines.map(l=>({id:uid(),t:l,done:false}))},data)); if(lines.length) expanded.add(nid)}
      closeSheet(); commit(); break}
    case "course":{
      const id=v("c-id"), name=v("c-name").trim(); if(!name) return;
      const color=(document.querySelector('input[name="c-color"]:checked')||{}).value||COLORS[0], room=v("c-room")||"main";
      if(id){const c=course(id); if(c){c.name=name;c.color=color;c.room=room;c.example=false}}
      else {const nid=uid(); S.courses.push({id:nid,name,color,room,archived:false,createdAt:Date.now()}); appearId=nid; if(view==="library"){libRoom=room;libZoom=null} toast(`Курс додано: кільце на головній і нова полиця в бібліотеці`)}
      closeSheet(); commit(); break}
    case "book":{
      const id=v("b-id"), title=v("b-title").trim(); if(!title) return;
      const data={title,author:v("b-author").trim(),type:v("b-type"),total:Math.max(1,parseInt(v("b-total"),10)||1),courseId:v("b-course"),status:v("b-status")};
      const prevB=id?S.books.find(x=>x.id===id):null;
      data.loan=document.getElementById("b-loan").checked?{lib:v("b-lib").trim()||"Бібліотека",due:v("b-ldue"),returned:null,since:(prevB&&prevB.loan&&prevB.loan.since)||today()}:null;
      let bk;
      if(id){bk=S.books.find(x=>x.id===id); if(bk){Object.assign(bk,data);bk.example=false;if(bk.page>bk.total)bk.page=bk.total}}
      else {bk=Object.assign({id:uid(),page:0},data); S.books.push(bk)}
      if(bk.status==="done") bk.page=bk.total;
      bookFinishCheck(bk);
      const c=course(bk.courseId); if(view==="library"&&c) libRoom=c.archived?"arch":(c.room||"main"); else if(view==="library"&&!c) libRoom="main";
      closeSheet(); commit(); break}
    case "pages": logPages(f.dataset.id,f.querySelector("input").value); if(f.dataset.close) closeSheet(); break;
    case "addModule": case "addModule2":{
      const d=v(f.dataset.form==="addModule"?"mod-date":"mod-date2"); if(!d) return;
      if(!S.settings.modules.includes(d)) S.settings.modules.push(d);
      commit(); if(f.dataset.form==="addModule2") sheetSettings(); else toast(`Модульний тиждень: ${fmtL(d)}`); break}
    case "tueNote":{const d=f.dataset.d; (S.tue[d]||(S.tue[d]={s:"",note:""})).note=v("tue-note"); closeSheet(); commit(); toast("Нотатку збережено"); break}
    case "room":{
      const id=v("r-id"), name=v("r-name").trim(); if(!name) return;
      if(id){const r=S.rooms.find(x=>x.id===id); if(r) r.name=name}
      else {const r={id:uid(),name}; S.rooms.push(r); libRoom=r.id}
      closeSheet(); commit(); break}
    case "settings":{
      const iv=v("s-iv").split(/[,\s]+/).map(x=>parseInt(x,10)).filter(x=>x>0).slice(0,8);
      S.settings.tueName=v("s-tname").trim()||"Вівторкове завдання";
      S.settings.name=v("s-name").trim()||"Ігор-Еней";
      if(iv.length) S.settings.intervals=iv;
      S.settings.fun=document.getElementById("s-fun").checked;
      closeSheet(); commit(); toast("Збережено"); break}
  }
});

/* ---------- boot ---------- */
const h0=(location.hash||"").slice(1); if(TABS.some(t=>t[0]===h0)) view=h0;
applyLook(); document.getElementById("decoLeaf").innerHTML=ART.bigleaf; render();
gateBoot();
})();
</script>
