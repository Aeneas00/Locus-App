  --line:rgba(18,48,42,.14);
  --accent:#1E8656; --accent-ink:#FFFFFF; --accent-soft:rgba(30,134,86,.15);
  --sun:#F0A62A; --sun-2:#FFD36B; --sun-ink:#2A1A00; --xp:#8E5C00; --xp-soft:rgba(240,166,42,.24);
  --good:#1E8656; --good-soft:rgba(30,134,86,.16); --warn:#B9402A; --warn-soft:rgba(185,64,42,.14);

  --streak:rgba(255,255,255,.16); --streak-2:rgba(255,255,255,.09); --vignette:rgba(20,70,60,.18);
  --toast:rgba(18,48,42,.88); --toast-ink:#F2FAF2;
  --wood-a:#D2A46C; --wood-b:#A9753F; --wood-edge:#7E5229; --moss:#5FA05A; --pot:#C8754A; --leaf:#3F8F4E;
  --f-display:"Philosopher","Palatino Linotype",Georgia,serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E2030; --ink:#EAF5EC; --ink-2:#A6C2B8;
  --glass:rgb(8 26 30 / var(--ga)); --glass-strong:rgba(9,24,30,.9); --glass-2:rgb(160 230 205 / calc(var(--ga2) * .2));

  --glass-edge:rgba(170,235,210,.20); --glass-hi:rgba(210,255,235,.16); --line:rgba(200,240,225,.15);

:root[data-frost="clear"]{--ga:.28;--ga2:.26;--blur:7px}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#horizon{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.glasspane{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(114deg,transparent 0 20%,var(--streak) 24%,transparent 30%,transparent 57%,var(--streak-2) 60%,var(--streak-2) 64%,transparent 66%),linear-gradient(180deg,var(--streak-2),transparent 28%);
  box-shadow:inset 0 0 140px var(--vignette)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);backdrop-filter:blur(var(--blur)) saturate(150%);
  border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi),0 12px 32px -8px var(--shadow-c)}

.wrap{position:relative;z-index:2;max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1} h2{font-size:1.3rem;line-height:1.2} h3{font-size:1.08rem}
.muted{color:var(--ink-2)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding:8px 10px 8px 12px;border-radius:999px;position:relative;z-index:30}
.sunbtn{border:0;background:none;padding:4px;margin:-4px 0;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:transform .3s}
.sunbtn:hover,.sunbtn[aria-expanded="true"]{transform:rotate(30deg) scale(1.15)}
:root[data-scene="night"] .brand i{background:none;box-shadow:inset -7px 3px 0 0 #F4F1E2;transform:rotate(-20deg)}
:root[data-scene="dawn"] .brand i,:root[data-scene="sunset"] .brand i{background:radial-gradient(circle,#FFC48A 0 38%,transparent 40%),repeating-conic-gradient(#E8875A 0 12deg,transparent 12deg 30deg)}
.scenemenu{position:absolute;top:calc(100% + 8px);left:8px;border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:220px;background:var(--glass-strong);z-index:40;animation:pop .2s ease-out}
.scenemenu[hidden]{display:none}
.sceneopt{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 10px;border-radius:12px;font-weight:700;text-align:left}
.sceneopt:hover{background:var(--glass-2)}
.sceneopt[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.sceneopt i{width:26px;height:26px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.iconbtn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.wsize{position:absolute;top:3px;left:calc(50% + 34px);height:16px;min-width:30px;padding:0 6px;border:0;border-radius:9px;background:none;color:var(--ink-2);font-family:var(--f-mono);font-size:.62rem;font-weight:700;opacity:.4;z-index:3;cursor:pointer}
.widget:hover > .wsize,.wsize:focus-visible{opacity:.9;background:var(--glass-2)}
.ringcenter .big{font-size:clamp(2.4rem,16cqi,5.4rem)!important}
.ringcenter .sub{font-size:clamp(.72rem,3.4cqi,.9rem)}
.ringcenter .of{font-size:clamp(.66rem,3cqi,.8rem)}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand i{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,var(--sun-2) 0 38%,transparent 40%),repeating-conic-gradient(var(--sun) 0 12deg,transparent 12deg 30deg)}
.top .grow{flex:1}
.lvl{border:1px solid var(--glass-edge);background:var(--glass-2);border-radius:999px;padding:4px 10px 4px 12px;font-weight:800;font-size:.78rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.lvl i{display:block;width:44px;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--sun) calc(var(--p)*100%),var(--track) 0)}
.sync{display:flex;align-items:center}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--ink-2);display:inline-block}
.sync.ok b{background:var(--good);box-shadow:0 0 8px var(--good)} .sync.local b{background:var(--sun)}
.iconbtn{border:1px solid var(--glass-edge);background:var(--glass-2);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--ink-2);font-weight:700;display:flex;align-items:center;gap:7px}
.tab svg{width:18px;height:18px}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:759px){
  .top .tabs{display:none}
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;border-left:0;border-right:0;border-bottom:0;border-radius:22px 22px 0 0;
    padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  .bottomnav .tabs{justify-content:space-around}
  .bottomnav .tab{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 14px;border-radius:14px}
}
@media (min-width:760px){.bottomnav{display:none}}
@media (max-width:420px){.lvl i{display:none}}

/* generic */
.card{border-radius:var(--r);padding:18px}
.btn{border:1px solid var(--glass-edge);border-radius:999px;padding:10px 18px;font-weight:700;background:var(--glass-2);display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 18px -6px var(--accent)}
.btn.sun{background:linear-gradient(135deg,var(--sun-2),var(--sun));color:var(--sun-ink);border-color:transparent;box-shadow:0 6px 18px -6px var(--sun)}
.btn.ghost{background:none;border-color:var(--line)}
.btn.danger{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.sm{padding:6px 13px;font-size:.84rem}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.73rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--glass-2);color:var(--ink-2);white-space:nowrap;border:1px solid var(--line)}
.chip.over{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.soon{background:var(--xp-soft);color:var(--xp);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.ex{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.empty{border:1.5px dashed var(--glass-edge);border-radius:18px;padding:18px;text-align:center;color:var(--ink-2);background:var(--glass-2)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:18px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}
.banner > span{flex:1;min-width:200px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding:14px 18px;border-radius:var(--r)}
.inp{border:1px solid var(--line);border-radius:999px;background:var(--glass-2);padding:8px 14px;min-width:0}
select.inp{padding-right:30px}

/* home grid */
.homebar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.homegrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:6px;column-gap:18px;row-gap:0;grid-auto-flow:row dense;align-items:start}
.homegrid > .widget{grid-column:span var(--span,3);container-type:inline-size}
@media (max-width:899px){.homegrid{grid-template-columns:minmax(0,1fr)}.homegrid > .widget{grid-column:1 / -1}.wsize{display:none}}
.w-full{grid-column:1 / -1}
.widget{border-radius:var(--r);padding:18px;position:relative;min-width:0}
.wtools{display:flex;align-items:center;gap:6px;margin:-6px -6px 12px;padding:6px 8px;border-radius:14px;background:var(--accent-soft);font-size:.82rem;font-weight:700}
.wtools span{flex:1}
.custom{border-radius:var(--r);padding:16px 18px;margin-bottom:18px;display:flex;flex-direction:column;gap:12px}
.custom .seg button{font-size:.8rem}
.tray{display:flex;gap:8px;flex-wrap:wrap}

/* module ring */
.ringw{text-align:center}
.ringbox{position:relative;width:min(100%,380px);aspect-ratio:1;margin:4px auto 0;max-width:100%}
.ringbox svg{width:100%;height:100%;display:block;transform:rotate(-90deg);overflow:visible}
.ringbox circle,.mini circle{fill:none}
.ring-track{stroke:var(--track)}
.ring-task{stroke:url(#sunGrad);stroke-linecap:round;filter:drop-shadow(0 0 8px var(--sun));transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring-time{stroke:var(--ink-2);stroke-linecap:round;opacity:.55;transition:stroke-dashoffset 1.1s}
.ring-time-track{stroke:var(--track)}
.time-dot{fill:var(--ink)}
.g-a{stop-color:var(--accent)} .g-b{stop-color:var(--sun)} .g-c{stop-color:var(--sun-2)}
.ringcore{fill:var(--glass-2)}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:18%}
.ringcenter .big{font-family:var(--f-display);font-weight:700;font-size:clamp(3.4rem,13vw,5.4rem);line-height:.95;font-variant-numeric:tabular-nums}
.ringcenter .sub{font-weight:700;font-size:.9rem}
.ringcenter .of{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2);margin-top:4px}
.pace{margin-top:10px}
.modline{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:.9rem}
.legend{display:flex;gap:14px;justify-content:center;font-size:.75rem;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:14px;height:5px;border-radius:9px;margin-right:6px;vertical-align:middle}
.modform{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* course rings */
.crings{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cring{border:1px solid var(--line);background:var(--glass-2);border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center;text-align:left;min-width:0}
.cring:hover{border-color:var(--accent)}
.mini{width:58px;height:58px;flex:none;position:relative}
.mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;font-weight:700}
.cring .nm{font-weight:800;font-size:.86rem;line-height:1.25;overflow-wrap:anywhere}
.cring .st{font-size:.75rem;color:var(--ink-2);font-weight:600}
.cring.add{justify-content:center;color:var(--ink-2);border-style:dashed;font-weight:700}

/* Tuesday line */
.tline{overflow-x:auto;padding:4px 2px 2px;margin:0 -4px}
.tline ol{list-style:none;margin:0;padding:0 8px;display:flex;min-width:max-content;position:relative}
.tline ol::before{content:"";position:absolute;left:30px;right:30px;top:20px;height:3px;border-radius:3px;background:var(--track)}
.tline li{width:66px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.tdot{width:22px;height:22px;margin-top:9px;border-radius:50%;border:2.5px solid var(--ink-2);background:var(--glass-strong);display:grid;place-items:center;padding:0;position:relative;z-index:1}
.tdot svg{width:12px;height:12px}
.tdot.done{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.tdot.off{border-style:dashed;opacity:.7}
.tdot.miss{border-color:var(--warn)}
.tdot.future{opacity:.45;border-width:2px;width:16px;height:16px;margin-top:12px}
.tdot.now{width:30px;height:30px;margin-top:5px;box-shadow:0 0 0 4px var(--xp-soft),0 0 18px var(--sun)}
.tline li span{font-size:.72rem;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tline li.cur span{color:var(--ink)}
.tline li.fill::after{content:"";position:absolute;top:20px;left:-33px;width:66px;height:3px;background:var(--good);z-index:0}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em}
.glass{background:var(--card);border:1px solid var(--glass-edge);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 12px 26px -18px var(--shadow-c);-webkit-backdrop-filter:none;backdrop-filter:none}
.widget{border-radius:26px}

/* page + frame */
.page{position:relative;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 60px}
.outdecor{position:absolute;inset:0;pointer-events:none}
.outdecor .lamp{position:absolute;top:-132px;left:34%;width:96px;z-index:3}
.outdecor .bigleaf{position:absolute;left:max(0px,calc(50% - 780px));bottom:-10px;width:250px;z-index:1;transform:rotate(-14deg);transform-origin:bottom center}
.frame{position:relative;z-index:2;max-width:1480px;margin:0 auto;background:var(--frame);border-radius:40px;padding:18px;display:grid;grid-template-columns:72px minmax(0,1fr) 72px;gap:20px;box-shadow:0 50px 90px -40px var(--shadow-c),0 0 0 1px var(--glass-edge)}
.rail-l,.rblock{background:var(--rail);border-radius:28px;display:flex;flex-direction:column;align-items:center;gap:8px}
.rail-l{padding:14px 0;position:sticky;top:16px;align-self:start;min-height:min(760px,calc(100vh - 100px))}
.rail-r{display:flex;flex-direction:column;gap:14px;position:sticky;top:16px;align-self:start}
.rblock{padding:12px 0;gap:10px}
.logo{width:46px;height:46px;border-radius:15px;background:var(--ink);color:var(--frame);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.04em;margin-bottom:10px}
.vtabs{flex-direction:column;gap:6px}
.vtabs .tab{width:48px;height:48px;padding:0;justify-content:center;border-radius:16px;position:relative;color:var(--ink-2)}
.vtabs .tab svg{width:21px;height:21px}
.vtabs .tab span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.vtabs .tab[aria-current="page"]{background:var(--ink);color:var(--frame);box-shadow:none}
.vtabs .tab:hover:not([aria-current]){background:var(--glass-2);color:var(--ink)}
.rail-l .grow{flex:1}
.addbtn{width:46px;height:46px;border-radius:50%;border:2px dashed var(--ink-2);background:none;color:var(--ink);display:grid;place-items:center;margin-top:12px}
.addbtn svg{width:20px;height:20px}
.ravatar{position:relative;width:50px;height:50px;border:0;background:none;padding:0;border-radius:50%}
.ravatar svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ravatar span{position:absolute;inset:8px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:600;font-size:13px}
.ravatar.add{border:2px dashed var(--ink-2);width:44px;height:44px;display:grid;place-items:center;color:var(--ink-2)}
.ravatar.add svg{position:static;width:18px;height:18px;transform:none}
.ravatar:hover span{filter:brightness(1.08)}
.rmini{width:48px;height:48px;border-radius:16px;border:0;background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;line-height:1;box-shadow:0 0 0 1px var(--glass-edge)}
.rmini small{font-size:10px;font-weight:700;color:var(--ink-2);text-transform:uppercase}
.rmini b{font-family:var(--f-display);font-size:18px}
.rmini svg{width:20px;height:20px}
.rmini i{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.rmini.soon i{background:var(--sun);color:var(--sun-ink)} .rmini.over i{background:var(--warn);color:#fff}
.center{min-width:0}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:30;margin:4px 0 6px;min-height:52px}
.hello{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 280px}
.hello h1{font-size:26px;font-weight:400;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.hello h1 b{font-weight:600;color:var(--ink)}
.sunbtn i{display:inline-block;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,var(--sun-2) 0 38%,transparent 40%),repeating-conic-gradient(var(--sun) 0 12deg,transparent 12deg 30deg)}
:root[data-scene="night"] .sunbtn i{background:none;box-shadow:inset -8px 3px 0 0 var(--sun-2);transform:rotate(-20deg)}
:root[data-scene="dawn"] .sunbtn i,:root[data-scene="sunset"] .sunbtn i{background:radial-gradient(circle,#E8B48A 0 38%,transparent 40%),repeating-conic-gradient(#C98060 0 12deg,transparent 12deg 30deg)}
.scenemenu{top:calc(100% + 6px);left:0;background:var(--card);border:1px solid var(--glass-edge)}
.gsearch{position:relative;flex:1 1 220px;max-width:340px}
.gsearch svg{position:absolute;left:14px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.gsearch input{width:100%;border:0;background:var(--glass-2);border-radius:999px;padding:11px 16px 11px 40px;font:inherit;color:var(--ink);box-shadow:inset 0 0 0 1px var(--glass-edge)}
.gsearch input::placeholder{color:var(--ink-2)}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--glass-edge);border-radius:18px;padding:8px;box-shadow:0 20px 40px -20px var(--shadow-c);display:flex;flex-direction:column;gap:2px;z-index:45;max-height:60vh;overflow:auto}
.gres[hidden]{display:none}
.gres .label{padding:6px 10px 2px}
.gr{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:12px;padding:8px 10px;text-align:left;font-weight:700}
.gr:hover,.gr:focus-visible{background:var(--glass-2)}
.gr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr small{color:var(--ink-2);font-weight:600;font-size:12px;white-space:nowrap}
.topbar .iconbtn{background:var(--card);border-color:var(--glass-edge);width:42px;height:42px}
.topbar .lvl{background:var(--card);border-color:var(--glass-edge)}
.focusbtn{padding:9px 16px}

/* hero */
.herorow{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:18px;margin:62px 0 26px}
.hero{position:relative;background:var(--hero);border-radius:30px;padding:28px 30px;min-height:240px;display:flex;align-items:center}
.herotext{max-width:calc(100% - 330px);display:flex;flex-direction:column;gap:12px;position:relative;z-index:2;min-width:0}
.hchip{align-self:flex-start;background:var(--frame);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.htitle{font-size:34px;line-height:1.08;font-weight:600;margin:0;overflow-wrap:anywhere}
.hdesc{margin:0;color:var(--ink-2);max-width:46ch}
.heroart{position:absolute;right:14px;bottom:0;width:340px;height:300px;z-index:1;pointer-events:none}
.heroart svg{width:100%;height:100%;display:block}
.upnext{display:flex;flex-direction:column;gap:12px;justify-content:center}
.upcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--glass-edge);border-radius:20px;padding:12px 14px;text-align:left;min-width:0}
.upcard:hover{border-color:var(--ink-2)}
.upic{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:600}
.uptxt{flex:1;min-width:0}
.uptxt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.uptxt small{color:var(--ink-2);font-weight:600}
.chev{width:20px;height:20px;color:var(--ink-2);flex:none}

/* pop-out props */
.deco{position:absolute;pointer-events:none;z-index:6;color:var(--ink-2)}
.deco svg{display:block;width:100%;height:auto}
.deco-ring{bottom:-34px;left:-34px;width:116px;transform:rotate(-10deg)}
.deco-tasks{bottom:-40px;right:-26px;width:92px;transform:rotate(8deg)}
.deco-reading{bottom:-22px;right:30px;width:112px;transform:rotate(-4deg)}
.deco-tue{bottom:-26px;left:-26px;width:70px}
.deco-courses{bottom:-28px;right:-20px;width:80px;transform:rotate(-10deg)}
.xpdeco{position:absolute;top:-30px;right:-22px;width:96px;transform:rotate(-10deg);color:var(--ink-2);pointer-events:none}

/* library windows look onto the sky of the chosen time of day */
.glassf{fill:url(#skyGrad)}
.focus{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
.chip{background:var(--glass-2);border-color:var(--glass-edge)}
.btn{background:var(--card);border-color:var(--glass-edge)}
.btn.primary{background:var(--ink);color:var(--frame);box-shadow:none}
.btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:none}
.tab[aria-current="page"]{background:var(--ink);color:var(--frame)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--frame)}
.ring-task{filter:none}
.bottomnav.glass{background:var(--frame)}

@media (max-width:1180px){.rail-r{display:none}.frame{grid-template-columns:72px minmax(0,1fr)}}
@media (max-width:1000px){.herorow{grid-template-columns:minmax(0,1fr)}}
@media (max-width:759px){
  .page{padding-block:10px 96px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .outdecor{display:none}
  .frame{grid-template-columns:minmax(0,1fr);padding:12px;border-radius:28px}
  .rail-l{display:none}
  .hello h1{font-size:21px}
  .gsearch{max-width:none;order:5;flex-basis:100%}
  .herorow{margin-top:56px}
  .hero{padding:22px 20px;min-height:0;align-items:flex-start}
  .herotext{max-width:100%;padding-top:70px}
  .heroart{width:200px;height:176px;top:-62px;right:0;bottom:auto}
  .htitle{font-size:27px}
  .deco{transform:scale(.8)}
}

.page{padding-block:64px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.frame{max-width:1400px;background:var(--frame-bg);background-attachment:fixed;background-color:var(--frame);box-shadow:0 0 0 1px rgba(70,44,20,.28),0 46px 90px -34px rgba(40,20,5,.6),inset 0 1px 0 rgba(255,255,255,.3)}

h1,h2,h3{font-family:var(--f-display)}
.rail-l,.rblock{background:var(--rail);border:1px solid var(--glass-edge)}
.logo{background:#2F4636;color:#F3E6C8;font-family:var(--f-display);font-style:italic;box-shadow:inset 0 0 0 2px rgba(214,174,95,.6)}
.vtabs .tab[aria-current="page"],.tab[aria-current="page"],.seg button[aria-pressed="true"]{background:var(--navact);color:var(--navact-ink)}
.hello h1{font-size:28px}
.hello h1 b{font-style:italic}
.label{color:var(--ink-2)}
.scrim{background:rgba(30,18,8,.45)}
.sheet{background:var(--card)}
.btn.primary{background:var(--ink);color:var(--frame)}
.btn.sun{background:linear-gradient(180deg,var(--sun-2),var(--sun));color:var(--sun-ink)}
.focusbtn{background:linear-gradient(180deg,var(--sun-2),var(--sun))}
:root[data-tone="dark"] .deco svg{filter:brightness(.86) saturate(.92)}

/* the lamp: three Edison bulbs on cords from the ceiling, fixed in the top-left corner */
.lampfix{position:fixed;top:0;left:calc(max(28px,(100vw - 1400px) / 2) + 128px);width:124px;z-index:35;pointer-events:none}
.lampfix svg{display:block;width:124px;height:auto;overflow:visible;transform-origin:62px 0}
.lampfix .bulb{pointer-events:visiblePainted;cursor:pointer}
.lampfix .cord{stroke:#2B211A}
.lampfix .cap{fill:#9C7A3C}
.lampfix .globe{fill:rgba(255,246,226,.30);stroke:rgba(110,80,50,.55);stroke-width:1.2}
.lampfix .fil{fill:none;stroke:#8C6A3C;stroke-width:1.2}
:root[data-lamp="on"] .lampfix .globe{fill:url(#bulbLit);stroke:rgba(255,214,150,.8)}
:root[data-lamp="on"] .lampfix .fil{stroke:#FFF4C8}
:root[data-lamp="on"] .lampfix .bulb{filter:drop-shadow(0 0 5px rgba(255,190,90,.9)) drop-shadow(0 0 16px rgba(255,160,60,.55))}
:root[data-lamp="on"][data-tone="dark"] .lampfix .bulb{filter:drop-shadow(0 0 6px rgba(255,190,90,1)) drop-shadow(0 0 22px rgba(255,150,50,.85)) drop-shadow(0 0 48px rgba(255,140,40,.5))}
:root[data-tone="dark"] .lampfix .cord{stroke:#0E0A07}
.lampfix.swing svg{animation:swing 1.7s cubic-bezier(.3,.7,.4,1)}
@keyframes swing{0%{transform:rotate(0)}18%{transform:rotate(7deg)}40%{transform:rotate(-4deg)}62%{transform:rotate(2deg)}82%{transform:rotate(-.8deg)}100%{transform:rotate(0)}}

:root[data-tone="dark"] .hero::before{filter:brightness(.38) saturate(.85)}
.heroart{width:400px;height:310px;right:8px}
.heroart svg{overflow:visible}
.herotext{max-width:calc(100% - 400px)}
.hchip{background:var(--card);border:1px solid var(--glass-edge)}
.htitle{font-size:36px;font-weight:600}
.heroart .hglow{opacity:.55}
:root[data-tone="dark"] .heroart .hglow{opacity:1}
:root[data-tone="dark"] .heroart .shade{fill:#E9B35E}
.upcard{background:var(--card)}

/* library: one dashboard card per subject, each with its own wooden shelf */
.libtop2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.libw{border-radius:26px;padding:18px;position:relative;min-width:0}
.libsec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:8px 4px 12px}
.libsec h2{font-size:1.35rem}
.shelfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;align-items:start}
.shelfcard{position:relative;border-radius:26px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:opacity .2s}
.shelfcard.dim{opacity:.38}
.shelfcard.dusty .shelfbox{filter:saturate(.55) brightness(.9)}
.shead{display:flex;align-items:center;gap:8px;min-width:0}
.shead h3{margin:0;font-size:1.12rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead .dh{width:22px;height:30px;border-radius:8px;margin-left:-6px}
.shead .dh:hover{background:var(--glass-2);opacity:.9}
.shead .iconbtn{width:34px;height:34px}
.shead .iconbtn svg{width:16px;height:16px}
.shelfbox{border-radius:12px;padding:12px 12px 0;margin:4px 4px 0;background:linear-gradient(90deg,rgba(0,0,0,.30),transparent 9%,transparent 91%,rgba(0,0,0,.30)),linear-gradient(180deg,var(--wood),#22180F);box-shadow:inset 0 10px 18px -8px rgba(0,0,0,.6),0 0 0 5px #7A573A,0 0 0 6px #4E3624,0 10px 18px -10px rgba(40,20,5,.6)}
.srow{display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:3px;background:repeating-linear-gradient(180deg,transparent 0 100px,#1E140C 100px 101px,#B08560 101px 103px,#8A6442 103px 107px,#6A4A30 107px 110px)}
.sslot{height:100px;margin-bottom:10px;display:flex;align-items:flex-end;flex:none}
.shelfcard .spine{height:calc(var(--h) * .58);width:calc(var(--w) * .74);padding:6px 0;box-shadow:inset -3px 0 0 rgba(0,0,0,.18),inset 2px 0 0 rgba(255,255,255,.08)}
.shelfcard .spine span{font-size:.56rem;max-height:calc(var(--h) * .58 - 16px)}
.shelfcard .spine .rib{height:15px;top:-7px;width:5px;right:3px}
.shelfcard .spine .lt{height:11px;bottom:8px}
.shelfcard .spine:hover,.shelfcard .spine:focus-visible{transform:translateY(-6px)}
.sslot.more button{height:72px;width:36px;border-radius:4px;border:1px dashed rgba(255,236,210,.45);background:rgba(255,236,210,.07);color:#F3E6D0;font-weight:800;font-size:.74rem;writing-mode:vertical-rl;transform:rotate(180deg)}
.sslot.more button:hover{background:rgba(255,236,210,.16)}
.sslot.emptyslot{flex:1;align-items:center;justify-content:center;gap:12px;color:rgba(243,230,208,.75);font-size:.85rem;font-weight:600}
.sslot .plant{height:78px;width:auto;margin-left:6px}
.sslot .plant .lv{fill:#6F8A5E}.sslot .plant .lv2{fill:#8BA474}.sslot .plant .pot{fill:#B9805A}
.sfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2);font-weight:600;padding:0 2px}
.sfoot .bar{flex:1 1 40px;margin:0}
.sfoot span{white-space:nowrap}
.strail{position:absolute;top:-18px;right:26px;width:74px;pointer-events:none;z-index:4}
.strail svg{display:block;width:100%;height:auto}
:root[data-tone="dark"] .strail svg{filter:brightness(.8)}
.shelfghost{border:2px dashed var(--glass-edge);background:transparent;border-radius:26px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-2);font-weight:700}
.shelfghost svg{width:26px;height:26px}
.shelfghost small{font-weight:600}
.shelfghost:hover{border-color:var(--ink-2);color:var(--ink)}
.archdet{margin-top:22px}
.archdet summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink-2);padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--glass-edge)}
.archdet summary::-webkit-details-marker{display:none}
.archdet[open] summary{margin-bottom:14px}
.reslist .res{background:var(--card)}
@media (max-width:999px){.libtop2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:759px){.page{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}.frame{background-attachment:scroll}.hero::before{-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.85) 0,rgba(0,0,0,.85) 26%,transparent 46%);mask-image:linear-gradient(180deg,rgba(0,0,0,.85) 0,rgba(0,0,0,.85) 26%,transparent 46%)}.shelfgrid{grid-template-columns:minmax(0,1fr)}.lampfix,.lamphalo{display:none}.heroart{width:220px;height:170px}.herotext{max-width:100%}.page{padding-block:10px 96px}}
@media (min-width:760px) and (max-width:1100px){.heroart{width:300px;height:236px}.herotext{max-width:calc(100% - 290px)}}

/* everything reacts to the lamp: warm falloff on the surface, lit edge facing the lamp, shadow cast away from it */
.rail-l,.rblock,.hero,.upcard,.glass:not(.scenemenu):not(.bottomnav),.shelfcard{
  background-image:radial-gradient(circle at var(--lx) var(--ly),rgba(255,184,96,calc(var(--glowA) * var(--lamp))) 0,rgba(255,166,80,calc(var(--glowB) * var(--lamp))) 700px,transparent 1600px);
  box-shadow:inset var(--rx) var(--ry) 0 rgba(255,208,140,calc(var(--rimA) * var(--li) * var(--lamp))),0 0 0 1px var(--glass-edge),var(--sx) var(--sy) var(--sb) -8px rgba(var(--shC),calc(var(--shA) * (.3 + .7 * var(--li) * var(--lamp))));
  transition:box-shadow .5s ease,background-color .3s}

.hellocol{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:12px}

/* grades: compact card + pop-ups */
.gmain{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.gsum2{display:flex;align-items:baseline;gap:8px}
.gsum2 .gbig{font-family:var(--f-display);font-size:3.2rem;font-weight:700;line-height:1}
.gof{color:var(--ink-2);font-weight:700;font-size:1.05rem}
.gright{flex:1 1 220px;min-width:0}
.gprog{height:10px;margin:0 0 8px}
.gmeta{font-size:.84rem;font-weight:600;color:var(--ink-2)}
.gbtns{display:flex;gap:8px;align-items:center}
.gbtns svg{width:16px;height:16px}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.gchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--glass-2);font-size:.8rem;font-weight:600;color:var(--ink-2)}
.gchip b{color:var(--ink);font-family:var(--f-mono);font-weight:700}
.gchip.got{background:var(--good-soft)}
.gsclist,.gslist{display:flex;flex-direction:column;gap:2px}
.gscrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 52px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-weight:700}
.gscrow span:first-child{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.gscrow input{text-align:right}
.gsrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 32px;gap:8px;align-items:center;padding:4px 0}

/* quieter controls: content first, buttons recede */
.btn{background:transparent;border-color:var(--line);color:var(--ink-2);box-shadow:none}
.btn:hover{background:var(--glass-2);color:var(--ink)}

/* ===== safety: never render source text; no sideways scroll ===== */

@media (max-width:760px){

  .topbar{gap:8px}
  .topbar > .lvl,.topbar > .sync{display:none}
  .pagehead{flex-wrap:wrap}
  .pagehead > *{min-width:0}
  .calhead2 .row{flex-wrap:wrap}

const mondayOf=s=>{const d=parse(s);return addDays(s,-((d.getDay()+6)%7))};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmtS=s=>parse(s).toLocaleDateString("uk-UA",{day:"numeric",month:"short"});
const fmtL=s=>parse(s).toLocaleDateString("uk-UA",{weekday:"short",day:"numeric",month:"long"});
function pl(n,a,b,c){const m=Math.abs(n)%100,k=m%10;if(m>10&&m<20)return c;if(k>1&&k<5)return b;if(k===1)return a;return c}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const hash=s=>{let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------- state ---------- */
function fresh(){
  return {v:5,updatedAt:0,xpLog:[],
    settings:{modules:[],tueName:"Вівторкове завдання",intervals:[1,3,7,14],scene:"theme",frost:"mid",
      home:{order:["ring","courses","tasks","tue","reading","loans","focus"],hidden:[]},fun:true},
    rooms:[{id:"main",name:"Головна зала"}],
    courses:[],tasks:[],books:[],tue:{},tueDates:[],xp:0,focus:{}};
}
function seed(s){
  const t=today(), now=Date.now();
  s.courses.push({id:"ex_c1",name:"Мистецькі вектори",color:COLORS[4],room:"main",archived:false,example:true,createdAt:now},
                 {id:"ex_c2",name:"Курс-приклад",color:COLORS[0],room:"main",archived:false,example:true,createdAt:now});
  const T=(id,c,title,due,done)=>({id,courseId:c,title,due,kind:"task",done:!!done,doneAt:done?now-864e5:null,example:true,createdAt:now});
  s.tasks.push(T("ex_t1","ex_c1","Конспект лекції 4",addDays(t,-1),true),
    Object.assign(T("ex_t2","ex_c1","Самоперевірка: пояснити 3 терміни з пам'яті",addDays(t,2)),{diff:1}),
    Object.assign(T("ex_t3","ex_c1","Стаття до семінару",addDays(t,5)),{subs:[{id:"ex_s1",t:"Прочитати статтю",done:true},{id:"ex_s2",t:"Виписати 3 тези",done:false},{id:"ex_s3",t:"Питання до семінару",done:false}]}),
    Object.assign(T("ex_t4","ex_c1","План есею",addDays(t,9)),{diff:3}),
    T("ex_t5","ex_c2","Презентація до заняття",addDays(t,-2),true),
    Object.assign(T("ex_t6","ex_c2","Нотатки до семінару",addDays(t,3)),{diff:2}),
    T("ex_t7","ex_c2","Тест до модуля",addDays(t,12)));
  s.books.push({id:"ex_b1",title:"Хрестоматія курсу",author:"Приклад",type:"книга",total:180,page:60,courseId:"ex_c1",status:"reading",example:true},
    {id:"ex_b2",title:"Стаття до семінару",author:"Приклад",type:"стаття",total:24,page:0,courseId:"ex_c1",status:"shelf",example:true},
    {id:"ex_b3",title:"Підручник курсу",author:"Приклад",type:"книга",total:320,page:0,courseId:"ex_c2",status:"shelf",example:true,loan:{lib:"Бібліотека УКУ",due:addDays(t,6),returned:null}},
    {id:"ex_b4",title:"Книга для себе",author:"Приклад",type:"книга",total:260,page:260,courseId:"",status:"done",example:true});
  s.seeded=true; return s;
}
function migrate(o){
  if(o.v===5) return o;
  if(o.v===4) return toV5(o);
  if(o.v===3){o.tueDates=Object.keys(o.tue||{}).filter(k=>o.tue[k]&&(o.tue[k].s||o.tue[k].note));if(o.settings)delete o.settings.tueStart;return toV5(o)}
  const s=fresh();
  if(o.settings&&Array.isArray(o.settings.intervals)) s.settings.intervals=o.settings.intervals;
  if(o.settings&&o.settings.tueName&&o.settings.tueName!=="Tuesday session") s.settings.tueName=o.settings.tueName;
  s.courses=(o.courses||[]).filter(c=>!c.example).map(c=>({id:c.id,name:c.name,color:c.color,room:"main",archived:false,createdAt:c.createdAt||Date.now()}));
  const ids=new Set(s.courses.map(c=>c.id));
  s.tasks=(o.tasks||[]).filter(t=>!t.example&&ids.has(t.courseId)).map(t=>({id:t.id,courseId:t.courseId,title:t.title,due:t.due||"",
    kind:t.kind==="review"?"review":"task",stage:t.stage||0,baseTitle:t.baseTitle,recall:t.kind==="learn"&&t.reviews!==false,
    done:!!t.done,doneAt:t.doneAt||null,childId:t.childId||null,createdAt:t.createdAt||Date.now()}));
  s.books=(o.books||[]).filter(b=>!b.example).map(b=>({id:b.id,title:b.title,author:b.author||"",type:b.type==="article"?"стаття":b.type==="chapter"?"розділ":"книга",
    total:b.total||1,page:b.page||0,courseId:ids.has(b.courseId)?b.courseId:"",status:b.status==="toread"?"shelf":b.status||"shelf",xpGiven:b.status==="done"}));
  for(const k in (o.tue||{})){const e=o.tue[k];if(e&&(e.s||e.note)) s.tue[k]={s:e.s||"",note:e.note||""}}
  s.tueDates=Object.keys(s.tue);
  for(const k in (o.wk||{})){if(o.wk[k].m) s.focus[k]=o.wk[k].m}
  s.xp=s.tasks.filter(t=>t.done).reduce((a,t)=>a+(t.kind==="review"?XP.review:XP.task),0)+Object.values(s.tue).filter(e=>e.s==="done").length*XP.tue+s.books.filter(b=>b.xpGiven).length*XP.book;
  s.updatedAt=o.updatedAt||0;
  if(!s.courses.length&&!s.books.length) seed(s);
  return toV5(s);
}
function normalize(s){
  (s&&s.courses||[]).forEach(c=>{if(c&&c.color in OLDC) c.color=COLORS[OLDC[c.color]]});
  s=migrate(s); const f=fresh();
  for(const k in f) if(s[k]===undefined) s[k]=f[k];
  s.settings=Object.assign(f.settings,s.settings||{});
  s.settings.home=Object.assign({order:f.settings.home.order,hidden:[]},s.settings.home||{});
  for(const w of Object.keys(WIDGETS)) if(!s.settings.home.order.includes(w)) s.settings.home.order.push(w);
  if(!s.rooms.some(r=>r.id==="main")) s.rooms.unshift({id:"main",name:"Головна зала"});
  {const cut=addDays(today(),-183); s.pages=s.pages||{}; s.focusDay=s.focusDay||{};
   for(const k of Object.keys(s.pages)) if(k<cut) delete s.pages[k];
   for(const k of Object.keys(s.focusDay)) if(k<cut) delete s.focusDay[k];
   if(s.focus) for(const k of Object.keys(s.focus)) if(k<mondayOf(cut)) delete s.focus[k];}
  if(!s.settings.nameV2){if(!s.settings.name||s.settings.name==="Ігор") s.settings.name="Ігор-Еней"; s.settings.nameV2=1}
  if(!Array.isArray(s.events)) s.events=[];
  if(!Array.isArray(s.tags)||!s.tags.length) s.tags=[{id:"sup",name:"Супервізія",color:"#5F9447"},{id:"mod",name:"Модуль",color:"#C98F25"},{id:"evt",name:"Подія",color:"#4F7FB0"}];
  return s;
}
function toV5(o){
  let x=0;
  (o.tasks||[]).forEach(t=>{if(t.done){t.xpGot=taskXP(t);x+=t.xpGot}});
  x+=Object.values(o.tue||{}).filter(e=>e&&e.s==="done").length*XP.tue;
  x+=(o.books||[]).filter(b=>b.xpGiven).length*XP.book;
  o.xp=x; o.xpLog=o.xpLog||[]; o.v=5; return o;
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw))}catch(e){}return null}
let S=load()||seed(fresh());
let undoSnap=null, pendingToasts=[];

/* ---------- XP (small bonus) ---------- */
const xpFor=L=>50*L*(L-1);
function level(x){let L=1;while(xpFor(L+1)<=x)L++;return L}
function logXP(n,why){if(!n)return;S.xpLog=[{ts:Date.now(),n,why:why||""},...(S.xpLog||[])].slice(0,40)}
function takeXP(n,why){if(!n)return;S.xp=Math.max(0,S.xp-n);logXP(-n,"Скасовано: "+(why||""))}
function addXP(n,quiet,why){const b=level(S.xp);S.xp=Math.max(0,S.xp+n);logXP(n,why);if(n>0){const a=level(S.xp);if(a>b)pendingToasts.push({msg:`Рівень ${a}`,cls:"sun"});else if(!quiet)pendingToasts.push({msg:`+${n} XP`})}}

/* ---------- persistence ---------- */
let ref=null, syncMode="loading", writing=false, dirty=false, timer=null;
function setSync(){const el=document.getElementById("sync");if(!el)return;el.className="sync "+(syncMode==="cloud"?"ok":syncMode==="local"?"local":"");
  el.title=syncMode==="cloud"?"Збережено в акаунті":syncMode==="local"?"Збережено лише на цьому пристрої":"Підключення…"}
function commit(opts={}){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(ref){dirty=true;clearTimeout(timer);timer=setTimeout(flush,600)}
  if(!opts.norender) render();
  flushToasts();
}
let sb=null, sbUser=null, cloudFailShown=false;
const errText=e=>(e&&(e.message||e.error_description||e.hint))||"невідома помилка";
/* writes the whole app state into user_data.content for the logged-in user */
function saveBtnState(st){const b=document.getElementById("btnCloud"); if(!b) return; b.classList.remove("saving","done","fail"); if(st) b.classList.add(st); const t=b.querySelector("span"); if(t) t.textContent=st==="saving"?"Зберігаю…":st==="done"?"Збережено":st==="fail"?"Помилка":"Зберегти"; if(st==="done"||st==="fail") setTimeout(()=>saveBtnState(""),2200)}
async function saveToCloud(manual){
  if(manual) saveBtnState("saving");
  if(!sb){if(manual) toast("Не вдалося зберегти: немає підключення до Supabase"); return false}
  try{
    const {data:{user},error:ue}=await sb.auth.getUser();
    if(ue) throw ue; if(!user) throw new Error("ти не увійшов в акаунт");
    sbUser=user;
    const row={user_id:user.id,updated_at:new Date().toISOString()}; row[DATA_COLUMN]=JSON.parse(JSON.stringify(S));
    const {error}=await sb.from(DATA_TABLE).upsert(row,{onConflict:"user_id"});
    if(error) throw error;
    syncMode="cloud"; setSync(); cloudFailShown=false;
    if(manual){toast("Дані збережено в хмарі!"); saveBtnState("done")}
    return true;
  }catch(e){
    syncMode="local"; setSync(); console.error("Supabase save failed",e);
    if(manual) saveBtnState("fail");
    if(manual||!cloudFailShown){toast("Не вдалося зберегти в хмару: "+errText(e)); cloudFailShown=true}
    return false;
  }
}
async function flush(){
  if(!ref||!sb||writing||!dirty) return;
  writing=true; dirty=false;
  const ok=await saveToCloud(false);
  if(!ok){dirty=true; setTimeout(flush,8000+Math.random()*2000)}
  writing=false; if(dirty&&ok) flush();
}
/* SELECT the row matching auth.uid() */
async function pullRemote(){
  const {data:{user}}=await sb.auth.getUser(); if(user) sbUser=user;
  const {data,error}=await sb.from(DATA_TABLE).select(DATA_COLUMN+",updated_at").eq("user_id",sbUser.id).maybeSingle();
  if(error) throw error;
  let c=data&&data[DATA_COLUMN]; if(typeof c==="string"){try{c=JSON.parse(c)}catch(e){c=null}}
  return c&&typeof c==="object"&&Array.isArray(c.tasks)?c:null;
}
async function initCloud(){
  if(!sb||!sbUser){syncMode="local";setSync();return}
  try{
    const raw=await pullRemote(); ref={};
    if(raw){const remote=normalize(JSON.parse(JSON.stringify(raw)));
      if((remote.updatedAt||0)>=(S.updatedAt||0)){S=remote;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}applyLook();render();syncMode="cloud";setSync();toast("Дані завантажено з хмари")}
      else{dirty=true;await flush()}}
    else{dirty=true;await flush()}
  }catch(e){ref={};dirty=true;syncMode="local";setSync();console.error("Supabase load failed",e);toast("Не вдалося завантажити з хмари: "+errText(e));setTimeout(flush,5000)}
}
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState!=="visible"||!ref||!sbUser||dirty||writing) return;
  try{const raw=await pullRemote(); if(raw&&(raw.updatedAt||0)>(S.updatedAt||0)){S=normalize(JSON.parse(JSON.stringify(raw)));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}applyLook();render()}}catch(e){}
});

/* ---------- gate: Supabase login, then access code ---------- */
const OWNER_KEY="studyquest.owner", UNLOCK_KEY="studyquest.unlocked";
const $g=id=>document.getElementById(id);
let gMode="in";
function gShow(which){["gateLoad","gateAuth","gateCode"].forEach(id=>{$g(id).hidden=id!==which}); const f=which==="gateAuth"?$g("gEmail"):which==="gateCode"?$g("gCode"):null; if(f) setTimeout(()=>f.focus(),30)}
function gMsg(id,txt,cls){const el=$g(id); el.textContent=txt||""; el.className="gmsg"+(cls?" "+cls:"")}
function gErr(e){const m=(e&&e.message)||"";
  if(/invalid login credentials/i.test(m)) return "Неправильна пошта або пароль.";
  if(/email not confirmed/i.test(m)) return "Спершу підтверди пошту за посиланням у листі.";
  if(/already registered|already exists/i.test(m)) return "Ця пошта вже зареєстрована. Увійди.";
  if(/password/i.test(m)&&/6|short|least/i.test(m)) return "Пароль має бути щонайменше 6 символів.";
  if(/rate limit|too many/i.test(m)) return "Забагато спроб. Зачекай хвилину.";
  if(/fetch|network/i.test(m)) return "Немає зв'язку з сервером. Перевір інтернет.";
  return m||"Щось пішло не так. Спробуй ще раз.";}
function setGMode(m){gMode=m; document.querySelectorAll("[data-gmode]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.gmode===m)));
  $g("gAuthBtn").textContent=m==="in"?"Увійти":"Зареєструватися"; $g("gPass").autocomplete=m==="in"?"current-password":"new-password"; gMsg("gAuthMsg","")}
function toCode(){
  $g("gWho").textContent="Ти увійшов як "+(sbUser.email||"користувач")+".";
  let ok=false; try{ok=sessionStorage.getItem(UNLOCK_KEY)===sbUser.id}catch(e){}
  if(ok) unlock(); else {gMsg("gCodeMsg",""); $g("gCode").value=""; gShow("gateCode")}
}
function unlock(){
  let own=null; try{own=localStorage.getItem(OWNER_KEY)}catch(e){}
  if(own!==sbUser.id){S=seed(fresh()); S.updatedAt=0; try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(OWNER_KEY,sbUser.id)}catch(e){}}
  try{sessionStorage.setItem(UNLOCK_KEY,sbUser.id)}catch(e){}
  document.body.classList.remove("locked"); applyLook(); render(); if(getFocus()) showFocus(); initCloud();
}
async function logout(){
  try{if(dirty) await flush()}catch(e){}
  try{sessionStorage.removeItem(UNLOCK_KEY);localStorage.removeItem(KEY);localStorage.removeItem(OWNER_KEY)}catch(e){}
  try{if(sb) await sb.auth.signOut()}catch(e){}
  location.reload();
}
async function gateBoot(){
  document.body.classList.add("locked"); gShow("gateLoad");
  if(!window.supabase||!window.supabase.createClient){gMsg("gateLoad","Не вдалося завантажити Supabase. Перевір інтернет і онови сторінку.","err");return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  document.addEventListener("click",e=>{const b=e.target.closest("[data-gmode]"); if(b) setGMode(b.dataset.gmode)});
  $g("gateAuth").addEventListener("submit",async ev=>{
    ev.preventDefault(); const email=$g("gEmail").value.trim(), password=$g("gPass").value, btn=$g("gAuthBtn");
    if(!email||!password){gMsg("gAuthMsg","Введи пошту й пароль.","err");return}
    if(password.length<6){gMsg("gAuthMsg","Пароль має бути щонайменше 6 символів.","err");return}
    btn.disabled=true; gMsg("gAuthMsg",gMode==="in"?"Входжу…":"Реєструю…");
    try{
      if(gMode==="in"){const {data,error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error; sbUser=data.user; toCode()}
      else{const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}); if(error) throw error;
        if(data.session){sbUser=data.user; toCode()} else {setGMode("in"); gMsg("gAuthMsg","Готово. Ми надіслали лист на "+email+": підтвердь пошту й увійди.","ok")}}
    }catch(e){gMsg("gAuthMsg",gErr(e),"err")}
    btn.disabled=false;
  });
  $g("gateCode").addEventListener("submit",ev=>{
    ev.preventDefault(); const v=$g("gCode").value.trim();
    if(v===ACCESS_CODE){unlock()} else {gMsg("gCodeMsg","Неправильний код.","err"); const c=document.querySelector(".gcard"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); $g("gCode").select()}
  });
  try{
    const {data}=await sb.auth.getSession();
    if(data&&data.session){sbUser=data.session.user; toCode()} else gShow("gateAuth");
  }catch(e){gShow("gateAuth"); gMsg("gAuthMsg",gErr(e),"err")}
  sb.auth.onAuthStateChange((ev,sess)=>{if(ev==="SIGNED_OUT"&&!document.body.classList.contains("locked")) location.reload()});
}

/* ---------- toasts / undo ---------- */
function toast(msg,cls="",action){
  const box=document.getElementById("toasts");
  const el=document.createElement("div");el.className="toast "+cls;
  const sp=document.createElement("span");sp.textContent=msg;el.appendChild(sp);
  if(action){const b=document.createElement("button");b.textContent=action.label;b.onclick=()=>{action.fn();el.remove()};el.appendChild(b)}
  box.appendChild(el);while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>el.remove(),action?6000:cls.includes("fun")?4000:2600);
}
function flushToasts(){const q=pendingToasts;pendingToasts=[];q.forEach(t=>toast(t.msg,t.cls||""))}
function snap(){undoSnap=JSON.stringify(S)}
function undoToast(msg){toast(msg,"",{label:"Повернути",fn:()=>{if(undoSnap){S=normalize(JSON.parse(undoSnap));undoSnap=null;applyLook();commit()}}})}

/* ---------- look: scene + glass ---------- */
const darkMQ=window.matchMedia("(prefers-color-scheme: dark)");
function hostDark(){const t=document.documentElement.getAttribute("data-theme");if(t==="dark")return true;if(t==="light")return false;return darkMQ.matches}
function sceneByTime(){const h=new Date().getHours();return h>=5&&h<9?"dawn":h>=9&&h<17?"day":h>=17&&h<21?"sunset":"night"}
function applyLook(){
  const root=document.documentElement, sc=S.settings.scene;
  let scene, tone;
  if(sc==="theme"){tone=hostDark()?"dark":"light"; scene=tone==="dark"?"night":"day"}
  else{scene=sc==="time"?sceneByTime():sc; tone=(scene==="sunset"||scene==="night")?"dark":"light"}
  root.dataset.scene=scene; root.dataset.tone=tone;
  root.dataset.frost=S.settings.frost||"mid";
  root.dataset.lamp=S.settings.lampOff?"off":"on";
  root.dataset.skin=S.settings.skin==="solar"?"solar":"loft";
  light();
}
new MutationObserver(m=>{if(m.some(x=>x.attributeName==="data-theme")&&S.settings.scene==="theme")applyLook()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
darkMQ.addEventListener&&darkMQ.addEventListener("change",()=>{if(S.settings.scene==="theme")applyLook()});
setInterval(()=>{if(S.settings.scene==="time")applyLook()},600000);


/* ---------- lamp light: every surface knows where the lamp is ---------- */
const LIT_SEL=".rail-l,.rblock,.hero,.upcard,.glass:not(.scenemenu):not(.bottomnav),.shelfcard";
let litRAF=0, lastL="";
function lightNow(){
  litRAF=0;
  const core=document.getElementById("lampCore"), root=document.documentElement;
  let Lx=innerWidth*.9, Ly=-80;
  if(core){const rc=core.getBoundingClientRect(); if(rc.width||rc.height||rc.left){Lx=rc.left+rc.width/2; Ly=rc.top+rc.height/2}}
  const lk=Lx.toFixed(0)+","+Ly.toFixed(0);
  if(lk!==lastL){lastL=lk; root.style.setProperty("--Lx",Lx.toFixed(0)+"px"); root.style.setProperty("--Ly",Ly.toFixed(0)+"px")}
  const H=innerHeight, todo=[];
  for(const el of document.querySelectorAll(LIT_SEL)){const r=el.getBoundingClientRect(); if(!r.width||r.bottom<-160||r.top>H+160) continue; todo.push([el,r])}
  for(const [el,r] of todo){
    const dx=r.left+r.width/2-Lx, dy=r.top+r.height/2-Ly, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
    const I=1/(1+(d/1050)**2), len=5+Math.min(30,d*.022), s=el.style;
    s.setProperty("--lx",(Lx-r.left).toFixed(0)+"px"); s.setProperty("--ly",(Ly-r.top).toFixed(0)+"px");
    s.setProperty("--sx",(ux*len).toFixed(1)+"px"); s.setProperty("--sy",(uy*len+5).toFixed(1)+"px"); s.setProperty("--sb",(16+len*1.5).toFixed(0)+"px");
    s.setProperty("--rx",(-ux*1.7).toFixed(2)+"px"); s.setProperty("--ry",(-uy*1.7).toFixed(2)+"px"); s.setProperty("--li",I.toFixed(3));
    if(el.classList.contains("hero")){s.setProperty("--plx",(Lx-r.left).toFixed(0)+"px"); s.setProperty("--ply",(Ly-r.top).toFixed(0)+"px")}
  }
}
function light(){if(!litRAF) litRAF=requestAnimationFrame(lightNow)}
addEventListener("scroll",light,{passive:true}); addEventListener("resize",light);
function toggleLamp(){

function cycle(){
  const t=today(), mods=[...new Set(S.settings.modules)].filter(Boolean).sort();
  let inMod=null; for(const d of mods) if(d<=t&&t<=addDays(d,6)) inMod=d;
  const next=mods.find(d=>d>t)||null;
  const prev=[...mods].reverse().find(d=>d<=t)||null;
  const start=prev||(next?addDays(next,-28):null);
  return {t,next,prev,start,inMod,mods};

function cycleTasks(cid){

function heroRow(){

function gsearch(q){
  const box=document.getElementById("gres"); if(!box) return;
  q=q.trim().toLowerCase(); if(!q){box.hidden=true;box.innerHTML="";return}

  box.innerHTML=(ts.length?`<div class="label">Завдання</div>`+ts.map(t=>{const c=course(t.courseId);return `<button class="gr" data-act="gsel" data-k="task" data-id="${t.id}"><i class="dot" style="background:${c.color}"></i><span>${esc(t.title)}</span><small>${t.done?"виконано":esc(c.name)}</small></button>`}).join(""):"")

async function exportData(){
  const name=`locus-backup-${today()}.json`, txt=JSON.stringify(S,null,2);
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename:name,data:txt}); toast("Резервну копію збережено"); return}
  }catch(e){if(e&&e.code==="declined") return}
  try{const url=URL.createObjectURL(new Blob([txt],{type:"application/json"})); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Резервну копію збережено")}
  catch(e){toast("Не вдалося зберегти файл")}
}
function importData(file){
  if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let o; try{o=JSON.parse(rd.result)}catch(e){toast("Це не JSON-файл");return}
    if(!o||typeof o!=="object"||!Array.isArray(o.tasks)||!Array.isArray(o.courses)){toast("У файлі немає даних Locus");return}
    snap(); S=normalize(o); S.updatedAt=Date.now(); applyLook(); closeSheet(); commit(); if(typeof saveToCloud==="function"){clearTimeout(timer); dirty=false; saveToCloud(true)}
    undoToast(`Імпортовано: ${S.courses.length} ${pl(S.courses.length,"курс","курси","курсів")}, ${S.tasks.filter(t=>t.kind==="task").length} завдань`);
  };
  rd.onerror=()=>toast("Не вдалося прочитати файл");
  rd.readAsText(file);
}

function critPool(){const cy=cycle(); return (cy.next?cycleTasks():openTasksAll()).filter(x=>x.kind==="task"&&!x.done)}
function critScore(t){const W={0:2,1:1,2:2,3:3}[t.diff||0]*(1-Math.min(.95,taskFrac(t))); const d=effDue(t); const n=d?diffDays(d,today()):60; return W/Math.max(.5,n+1)}
function critHTML(t){
  const pool=critPool(); if(!pool.some(x=>x.id===t.id)||pool.length<2) return '<span class="tcrit none"></span>';
  const s=critScore(t), below=pool.filter(x=>critScore(x)<s).length, lvl=clamp(Math.ceil((below+1)/pool.length*5),1,5);
  const word=["","низька","невисока","середня","висока","найвища"][lvl];
  return `<span class="tcrit l${lvl}" role="img" aria-label="Критичність: ${word}, ${lvl} з 5" title="Критичність: ${word} (${lvl} з 5) серед ${pool.length} ${pl(pool.length,"завдання","завдань","завдань")} до модуля. Враховує складність, залишок підпунктів і скільки днів до дедлайну."><span class="tcb">${[1,2,3,4,5].map(i=>`<i class="${i<=lvl?"on":""}"></i>`).join("")}</span><small>${word}</small></span>`;
}
function taskDue(t){
  if(t.done) return "";
  let d=t.due, lbl=t.kind==="review"?"повторити":"дедлайн", mod=false;
  if(!d&&t.kind==="task"&&cycle().next){d=cycle().next;lbl="до модуля";mod=true}
  if(!d) return "";
  const n=diffDays(d,today()), cls=n<0?"over":n<=3?"soon":"", rel=n<0?`прострочено ${-n} ${pl(-n,"день","дні","днів")}`:n===0?"сьогодні":n===1?"завтра":`за ${n} ${pl(n,"день","дні","днів")}`;
  return `<span class="tdue ${cls}${mod?" mod":""}${!mod&&t.kind==="task"&&cycle().next&&d>cycle().next?" later":""}" title="${mod?"Без власного дедлайну, рахується до модульного тижня":lbl}: ${fmtD(d)}">${mod?`<small>до наступного модуля</small><b>${n<=0?rel:`${n} ${pl(n,"день","дні","днів")}`}</b><span>${fmtS(d)}</span>`:`<small>${lbl}</small><b>${fmtS(d)}</b><span>${rel}</span>`}</span>`;

const TSORT=[["manual","Вручну"],["due","За дедлайном"],["plan","За запланованою датою"],["hard","Складність: від складних"],["easy","Складність: від легких"]];
function sortTasks(list,mode){
  if(mode==="manual") return list;
  const by=(k)=>(a,b)=>{const x=k(a),y=k(b);return x<y?-1:x>y?1:0};
  const dueK=t=>effDue(t)||"9999", planK=t=>t.plan||"9999", tie=(a,b)=>by(dueK)(a,b)||((a.createdAt||0)-(b.createdAt||0));
  const l=[...list];

let calMonth=null, calMode="mod";
function calendarHTML(){
  const t=today(); if(!calMonth) calMonth=t.slice(0,8)+"01";
  const first=parse(calMonth), y=first.getFullYear(), m=first.getMonth();
  const lead=(first.getDay()+6)%7, days=new Date(y,m+1,0).getDate();
  const mods=[...new Set(S.settings.modules)], tues=new Set(S.tueDates);
  const inWeek=d=>mods.some(s=>d>=s&&d<=addDays(s,6));
  let cells=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"].map(w=>`<span class="wd">${w}</span>`).join("");
  for(let i=0;i<lead;i++) cells+="<span></span>";
  for(let d=1;d<=days;d++){
    const ds=`${y}-${pad(m+1)}-${pad(d)}`, cls=["cday"];
    if(ds<t) cls.push("past"); if(ds===t) cls.push("today");
    if(mods.includes(ds)) cls.push("mod");
    if(tues.has(ds)) cls.push(calMode==="tue"?"tuemk":"tue");
    const lab=`${fmtL(ds)}${mods.includes(ds)?", початок модульного тижня":""}${tues.has(ds)?", "+S.settings.tueName.toLowerCase():""}`;
    cells+=`<button type="button" class="${cls.join(" ")}" data-act="calDay" data-d="${ds}" aria-label="${esc(lab)}" aria-pressed="${calMode==="mod"?mods.includes(ds):tues.has(ds)}">${d}</button>`;
  }
  const title=first.toLocaleDateString("uk-UA",{month:"long",year:"numeric"});
  const list=(calMode==="mod"?mods:[...tues]).filter(d=>d>=t).sort();
  const pastN=(calMode==="mod"?mods:[...tues]).filter(d=>d<t).length;
  return `<div class="cal"><div class="calhead"><button type="button" class="mini-btn" data-act="calNav" data-v="-1" aria-label="Попередній місяць">${ICON.back}</button><b>${title}</b><button type="button" class="mini-btn" data-act="calNav" data-v="1" aria-label="Наступний місяць" style="transform:scaleX(-1)">${ICON.back}</button></div>
    <div class="calgrid">${cells}</div>
    <div class="calleg"><span><i class="lg-mod"></i>модульний тиждень</span><span><i class="lg-tue"></i>${esc(S.settings.tueName.toLowerCase())}</span></div></div>
    <div class="modlist" style="margin-top:8px">${list.slice(0,8).map(d=>`<div><span>${fmtL(d)}${calMode==="mod"?` – ${fmtS(addDays(d,6))}`:""}</span><span class="muted mono" style="flex:none">${diffDays(d,t)===0?"сьогодні":"через "+diffDays(d,t)+" дн."}</span><button type="button" class="mini-btn" data-act="calDay" data-d="${d}" aria-label="Прибрати">${ICON.del}</button></div>`).join("")||`<small class="muted">${calMode==="mod"?"Наступних модульних тижнів не позначено.":"Наступних дат не позначено."}</small>`}
    ${pastN?`<small class="muted">Минулих дат: ${pastN}</small>`:""}</div>`;
}

function wTue(){
  const name=S.settings.tueName, dates=[...new Set(S.tueDates)].sort(), t=today();
  if(!dates.length) return `<div class="head"><h2>${esc(name)}</h2></div><div class="empty">Познач у календарі дні, коли будуть завдання. Вони з'являться тут лінією: минулі, найближче і майбутні.<div style="margin-top:10px"><button class="btn sm primary" data-act="settingsTue">Відкрити календар</button></div></div>`;
  const past=dates.filter(d=>d<=t), fut=dates.filter(d=>d>t), win=[...past.slice(-7),...fut.slice(0,6)];
  const nextD=fut[0]||null, last=past[past.length-1]||null, focusD=past.includes(t)?t:nextD;
  const doneN=past.filter(d=>S.tue[d]&&S.tue[d].s==="done").length, offN=past.filter(d=>S.tue[d]&&S.tue[d].s==="off").length;

    const e=S.tue[d]||{}, isFut=d>t, isToday=d===t;
    const st=e.s==="done"?"done":e.s==="off"?"off":isFut?"future":isToday?"":"miss";
    const fill=e.s==="done"&&prevDone; prevDone=e.s==="done";
    return `<li class="${d===focusD?"cur":""} ${fill?"fill":""}"><button class="tdot ${st} ${d===focusD?"now":""}" data-act="tueDot" data-d="${d}" aria-label="${fmtL(d)}${e.s==="done"?", виконано":e.s==="off"?", не було":isFut?", заплановано":", не позначено"}" title="${fmtL(d)}${e.note?" · "+esc(e.note):""}">${e.s==="done"?ICON.check:""}</button><span>${isToday?"сьогодні":fmtS(d)}</span></li>`}).join("");
  const le=last?S.tue[last]||{}:{};
  return `<div class="head"><h2>${esc(name)}</h2><span class="muted" style="font-size:.85rem">виконано <b class="mono">${doneN}</b> з <span class="mono">${past.length-offN}</span></span></div>

      ${last?`<b>Останнє: ${fmtS(last)}${last===t?" (сьогодні)":""}</b>${le.s==="done"?`<span class="chip good">виконано</span>`:le.s==="off"?`<span class="chip">не було</span>`:`<button class="btn sm primary" data-act="tue" data-d="${last}" data-s="done">${ICON.check}Позначити виконаним</button>`}`:`<b>Ще жодного не було</b>`}
      ${nextD?`<span class="chip soon">наступне: ${fmtS(nextD)} · через ${diffDays(nextD,t)} ${pl(diffDays(nextD,t),"день","дні","днів")}</span>`:""}
      <button class="btn sm ghost" data-act="settingsTue">Календар</button>
    </div>`;
}

/* ---------- focus ---------- */
let fTimer=null, focusMem=null;
function getFocus(){try{return JSON.parse(localStorage.getItem(FKEY)||"null")}catch(e){return null}}
function setFocus(f){try{f?localStorage.setItem(FKEY,JSON.stringify(f)):localStorage.removeItem(FKEY)}catch(e){}focusMem=f}
const PILLKEY="studyquest.pillpos";
/* timer state: {v:2, dur:minutes, endAt:ms, left:ms|null (paused), courseId} */
const fLeft=f=>f.left!=null?f.left:Math.max(0,f.endAt-Date.now());
function startFocus(min,courseId){
  closeFMenu(); min=clamp(Math.round(min)||25,1,600);
  setFocus({v:2,dur:min,endAt:Date.now()+min*60000,left:null,courseId:courseId!=null?courseId:(openCourse||"")}); showFocus();
}
let fmenuBtn=null;
function closeFMenu(){const m=document.getElementById("fmenu"); if(m) m.remove(); fmenuBtn=null}
function openFMenu(btn){
  if(fmenuBtn===btn){closeFMenu();return}
  closeFMenu();
  if(focusMem||getFocus()){showFocus(); const p=document.querySelector(".fpill"); if(p){p.classList.remove("ping"); void p.offsetWidth; p.classList.add("ping")} return}
  fmenuBtn=btn;
  const el=document.createElement("div"); el.id="fmenu"; el.className="fmenu"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Почати фокус");
  let last=25; try{last=+(localStorage.getItem("studyquest.flast")||25)||25}catch(e){}
  el.innerHTML=`<div class="fmhead"><b>Фокус-таймер</b><span>маленьке віконце, яке можна тягати</span></div>
    <div class="fmgrid">${[10,15,25,45,60].map(m=>`<button type="button" class="fmopt${m===last?" on":""}" data-act="fgo" data-v="${m}">${m}<small>хв</small></button>`).join("")}</div>
    <form class="fmcustom" data-form="fcustom"><label class="sr" for="fm-min">Свій час, хвилин</label><input class="inp" id="fm-min" type="number" min="1" max="600" inputmode="numeric" placeholder="свій час, хв"><button class="btn sm">Старт</button></form>
    <label class="field fmcourse"><span>Курс</span><select id="fm-course"><option value="">Без курсу</option>${activeCourses().map(c=>`<option value="${c.id}" ${c.id===openCourse?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label>`;
  document.body.appendChild(el);
  const r=btn.getBoundingClientRect(), w=el.offsetWidth, hh=el.offsetHeight;
  el.style.left=clamp(r.left+r.width/2-w/2,8,innerWidth-w-8)+"px";
  el.style.top=(r.bottom+8+hh>innerHeight&&r.top-hh-8>0?r.top-hh-8:r.bottom+8)+"px";
}
function fmGo(min){const c=(document.getElementById("fm-course")||{}).value||""; try{localStorage.setItem("studyquest.flast",String(min))}catch(e){} startFocus(min,c)}
function pillPos(el){let p=null; try{p=JSON.parse(localStorage.getItem(PILLKEY)||"null")}catch(e){}
  const w=el.offsetWidth||220, hh=el.offsetHeight||48;
  const x=p?clamp(p.x,8,innerWidth-w-8):innerWidth-w-92, y=p?clamp(p.y,8,innerHeight-hh-8):innerHeight-hh-(innerWidth<760?96:24);
  el.style.left=x+"px"; el.style.top=y+"px"}
const fmt2=ms=>{const s=Math.ceil(ms/1000), m=Math.floor(s/60); return (m>=60?Math.floor(m/60)+":"+pad(m%60):m)+":"+pad(s%60)};
function showFocus(){
  let f=focusMem||getFocus(); if(!f) return;
  if(f.v!==2||!f.dur){setFocus(null); return}
  focusMem=f;
  const c=f.courseId?course(f.courseId):null, paused=f.left!=null;
  const root=document.getElementById("focusRoot");
  root.innerHTML=`<div class="fpill${paused?" paused":""}" role="timer" aria-label="Фокус-таймер" style="${c?`--fc:${c.color}`:""}">
    <span class="fgrip" aria-hidden="true">${GRIP}</span><span class="fdot"></span>
    <span class="ftxt"><b id="fclock">${fmt2(fLeft(f))}</b><small>${c?esc(c.name):`таймер ${f.dur} хв`}</small></span>
    <button type="button" class="fbtn" data-act="fpause" aria-label="${paused?"Продовжити":"Пауза"}" title="${paused?"Продовжити":"Пауза"}">${paused?ICON.play:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>'}</button>
    <button type="button" class="fbtn ok" data-act="fstop" aria-label="Завершити й записати" title="Завершити й записати">${ICON.check}</button>
    <button type="button" class="fbtn" data-act="fcancel" aria-label="Скасувати без запису" title="Скасувати без запису">${ICON.x}</button>
  </div>`;
  pillPos(root.firstElementChild); clearInterval(fTimer); fTimer=setInterval(tick,500); tick();
}
function tick(){
  const f=focusMem; if(!f) return; const el=document.getElementById("fclock"); if(!el) return;
  const left=fLeft(f);
  if(left<=0){finishFocus(); return}
  const txt=fmt2(left); if(el.textContent!==txt) el.textContent=txt;
  document.title=(f.left!=null?"⏸ ":"")+txt+" · Locus";
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden) tick()});
function finishFocus(){const f=focusMem; if(!f) return; stopFocus(true,true)}
function fPause(){const f=focusMem; if(!f) return; if(f.left!=null){f.endAt=Date.now()+f.left; f.left=null} else f.left=Math.max(0,f.endAt-Date.now()); setFocus(f); showFocus()}
(function(){let d=null;
  document.addEventListener("pointerdown",e=>{const p=e.target.closest&&e.target.closest(".fpill"); if(!p||e.target.closest(".fbtn")||e.button!==0) return;
    const r=p.getBoundingClientRect(); d={p,dx:e.clientX-r.left,dy:e.clientY-r.top,id:e.pointerId}; p.classList.add("dragging"); try{p.setPointerCapture(e.pointerId)}catch(_){} e.preventDefault()});
  document.addEventListener("pointermove",e=>{if(!d||e.pointerId!==d.id) return; const w=d.p.offsetWidth, hh=d.p.offsetHeight;
    d.p.style.left=clamp(e.clientX-d.dx,8,innerWidth-w-8)+"px"; d.p.style.top=clamp(e.clientY-d.dy,8,innerHeight-hh-8)+"px"});
  const end=e=>{if(!d||e.pointerId!==d.id) return; d.p.classList.remove("dragging"); try{localStorage.setItem(PILLKEY,JSON.stringify({x:parseFloat(d.p.style.left),y:parseFloat(d.p.style.top)}))}catch(_){} d=null};
  document.addEventListener("pointerup",end); document.addEventListener("pointercancel",end);
  addEventListener("resize",()=>{const p=document.querySelector(".fpill"); if(p) pillPos(p)});
  document.addEventListener("click",e=>{if(document.getElementById("fmenu")&&!e.target.closest("#fmenu,[data-act=focus]")) closeFMenu()},true);
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("fmenu")){const b=fmenuBtn; closeFMenu(); if(b) b.focus()}});
})();
function stopFocus(log,finished){
  const f=focusMem; clearInterval(fTimer); document.getElementById("focusRoot").innerHTML=""; setFocus(null); document.title="Locus";
  if(!log||!f) return;
  const mins=finished?f.dur:Math.round((f.dur*60000-fLeft(f))/60000);
  if(mins<1){toast("Менше хвилини, не записано");return}
  const wk=mondayOf(today()); S.focus[wk]=(S.focus[wk]||0)+mins; S.focusDay=S.focusDay||{}; S.focusDay[today()]=(S.focusDay[today()]||0)+mins;
  pendingToasts.push({msg:finished?`Таймер ${mins} хв завершено й записано. Перерва: ~${Math.max(3,Math.round(mins/5))} хв`:`${mins} хв записано. Перерва: ~${Math.max(3,Math.round(mins/5))} хв`,cls:finished?"fun":""});
  commit();
}
